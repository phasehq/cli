# Temporary: proves CA rotation against a real Windows user Root store while
# PR #324 is open. Remove once it has passed.
name: "Windows CA rotation"

on:
  push:
    branches: [fix--windows-ca-rotation]
  workflow_dispatch:

jobs:
  rotation:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: src/go.sum

      - name: Build
        working-directory: src
        run: go build -o ..\phase-cli.exe .

      - name: Trust, rotate and re-trust the Phase AI CA
        shell: pwsh
        run: .\.github\scripts\windows-ca-rotation.ps1 .\phase-cli.exe
